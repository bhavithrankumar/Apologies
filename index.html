<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A little message for you </title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff8f5;color:#3d3435;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #f0c9c8;border-radius:28px;padding:34px;box-shadow:0 18px 60px #6b3c3c12;text-align:center}.heart{font-size:42px}.muted{color:#8a7475}.hint{background:#fff1ef;border-radius:16px;padding:13px;margin:18px 0}input{width:100%;padding:14px 16px;border:1px solid #e8cecd;border-radius:13px;font-size:17px;outline:none}button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:13px;background:#d9878d;color:white;font-size:17px;font-weight:600;cursor:pointer}#error{color:#b84e57;min-height:24px}.message{text-align:left;white-space:pre-wrap;line-height:1.7;background:#fff9f8;border-radius:18px;padding:22px;margin-top:18px}.hidden{display:none}
</style></head>
<body><main class="card"></div><section id="lock"><h1>A little message for you</h1><p class="muted">Enter the password to open it.</p><div class="hint">Hint: <span id="hint"></span></div><input id="password" type="password" placeholder="Password" autocomplete="off"><button id="open">Open message</button><p id="error"></p></section><section id="content" class="hidden"><h1>Happy Birthday Pro Max</h1><div id="message" class="message"></div></section></main>
<script src="config.js"></script><script>const c=window.BIRTHDAY_CONFIG;document.getElementById("hint").textContent=c.hint;function unlock(){const p=document.getElementById("password").value;if(p===c.password){document.getElementById("lock").classList.add("hidden");document.getElementById("content").classList.remove("hidden");document.getElementById("message").textContent=c.message}else document.getElementById("error").textContent="Wrong password ❤️"}document.getElementById("open").onclick=unlock;document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});</script></body></html>
